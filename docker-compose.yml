services:
  waf:
    image: owasp/modsecurity-crs:nginx
    ports:
      - "8080:8080"
    environment:
      - BACKEND=http://host.docker.internal:5000
      - PORT=8080
      - PARANOIA=4
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
